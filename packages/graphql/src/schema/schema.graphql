"Fitness today, for the Página inicial."
type FitnessToday {
  date: Date!
  eaten: MacroDay!
  target: MacroTarget
  "The last night logged."
  lastSleep: SleepLog
  "The Fichas set for today's weekday."
  plans: [WorkoutPlan!]!
  done: [WorkoutSession!]!
  "Today's steps as the phone counted them; null when it sent none."
  steps: Int
}

enum WorkoutGoal {
  HYPERTROPHY
  FAT_LOSS
  STRENGTH
  CONDITIONING
  HEALTH
}

enum WorkoutLevel {
  BEGINNER
  INTERMEDIATE
  ADVANCED
}

enum WorkoutEquipment {
  GYM
  HOME
  BODYWEIGHT
}

"What Fichas a Model should write, and for whom."
input WorkoutBrief {
  forName: String
  goal: WorkoutGoal!
  level: WorkoutLevel!
  daysPerWeek: Int!
  minutes: Int!
  equipment: WorkoutEquipment!
  notes: String
}

"An exercise as a Model wrote it, ready for WorkoutExerciseInput."
type WorkoutExerciseDraft {
  name: String!
  sets: Int!
  reps: String!
  "Kilograms as text, or null."
  load: String
  restSeconds: Int
  notes: String!
}

"A Ficha a Model wrote, not saved until the Viewer saves it."
type WorkoutPlanDraft {
  name: String!
  notes: String!
  weekdays: [Int!]!
  exercises: [WorkoutExerciseDraft!]!
}

"A shared Ficha as anyone with its link sees it."
type PublicWorkoutPlan {
  name: String!
  forName: String
  notes: String!
  weekdays: [Int!]!
  "Who made it."
  ownerName: String!
  exercises: [WorkoutExercise!]!
}

extend type Query {
  "Public: a shared Ficha by its link's secret, or null."
  publicWorkoutPlan(token: String!): PublicWorkoutPlan
  "Every Ficha, the Viewer's own first, then by whom they are for."
  workoutPlans: [WorkoutPlan!]!
  "Newest first; the last 90 days without dates."
  workoutSessions(from: Date, to: Date): [WorkoutSession!]!
  "The Refeições of some days, by day and time."
  meals(from: Date!, to: Date!): [Meal!]!
  macroTarget: MacroTarget
  "Each day from `from` to `to` (at most 92), with or without Refeições."
  macroDays(from: Date!, to: Date!): [MacroDay!]!
  "Newest first; the last 60 nights without dates."
  sleepLogs(from: Date, to: Date): [SleepLog!]!
  "Oldest first; every kind without one."
  measurements(kind: MeasureKind): [Measurement!]!
  fitnessToday: FitnessToday!
}

extend type Mutation {
  "Creates a Ficha (no id) or changes one, exercises and all."
  saveWorkoutPlan(id: ID, input: WorkoutPlanInput!): WorkoutPlan!
  "Its Treinos stay, without the link."
  deleteWorkoutPlan(id: ID!): Boolean!
  "Drafts written by the Agente's Model from a brief; nothing is saved."
  generateWorkoutPlans(brief: WorkoutBrief!): [WorkoutPlanDraft!]!
  "Opens a public link to the Ficha (a new secret each time), or closes it."
  shareWorkoutPlan(id: ID!, shared: Boolean!): WorkoutPlan!
  logWorkout(input: WorkoutSessionInput!): WorkoutSession!
  deleteWorkoutSession(id: ID!): Boolean!
  createMeal(input: MealInput!): Meal!
  updateMeal(id: ID!, input: MealInput!): Meal!
  deleteMeal(id: ID!): Boolean!
  setMacroTarget(input: MacroTargetInput!): MacroTarget!
  "Logs a night (no id) or changes one."
  saveSleepLog(id: ID, input: SleepLogInput!): SleepLog!
  deleteSleepLog(id: ID!): Boolean!
  addMeasurement(input: MeasurementInput!): Measurement!
  deleteMeasurement(id: ID!): Boolean!
}

# Integrações with the Agenda: a private link to it as a calendar file (.ics) the iPhone, Google
# Agenda or Outlook subscribe to.

"The Viewer's private calendar link: anyone with it reads their Agenda, so it can be replaced."
type CalendarFeed {
  "The path of the .ics file under the app's own address: /api/calendar/<secret>.ics."
  path: String!
  createdAt: DateTime!
}

extend type Query {
  calendarFeed: CalendarFeed
}

extend type Mutation {
  "On makes a new link (the old one stops working); off removes it."
  setCalendarFeed(on: Boolean!): CalendarFeed
}

"Where an outside calendar comes from, read by its host."
enum CalendarSource {
  ICLOUD
  GOOGLE
  OUTLOOK
  OTHER
}

"A calendar the Viewer keeps elsewhere, read by its secret .ics address; the address never leaves the server."
type ExternalCalendar {
  id: ID!
  name: String!
  source: CalendarSource!
  host: String!
  lastReadAt: DateTime
  "Why the last read failed, in pt-BR."
  error: String
}

extend type Query {
  externalCalendars: [ExternalCalendar!]!
}

extend type Mutation {
  "Reads the link first: one that is not a calendar is refused. webcal:// is read as https://."
  addExternalCalendar(name: String!, url: String!): ExternalCalendar!
  refreshExternalCalendar(id: ID!): ExternalCalendar!
  removeExternalCalendar(id: ID!): Boolean!
}

# Saúde do celular: an address the phone sends Apple Health or Health Connect data to
# (docs/adr/0029). What comes becomes Medidas, Sono, Treinos and the day's steps.

"How many readings of each kind came in a send."
type HealthCounts {
  steps: Int!
  weights: Int!
  bodyFat: Int!
  sleeps: Int!
  workouts: Int!
}

"The Viewer's private address for their phone's health data."
type HealthInbox {
  "Under the app's own address: /api/health/<secret>."
  path: String!
  createdAt: DateTime!
  lastReceivedAt: DateTime
  lastCounts: HealthCounts
}

extend type Query {
  healthInbox: HealthInbox
}

extend type Mutation {
  "On makes a new address (the old one stops working); off removes it, keeping what came."
  setHealthInbox(on: Boolean!): HealthInbox
}

  "Messages per month."
  messages: Int!
}

type Allowance {
  jobs: Int!
  messages: Int!
}

type Billing {
  "False while the server has no Stripe keys: paid Plans cannot be bought."
  configured: Boolean!
  plan: Plan!
  "Stripe's status of the Subscription, null if there never was one."
  status: String
  currentPeriodEnd: DateTime
  cancelAtPeriodEnd: Boolean!
  "Whether Stripe knows the Organization, so the portal can open."
  hasCustomer: Boolean!
  "Plan plus credits."
  limits: Allowance!
  "From Usage codes redeemed this month."
  credits: Allowance!
  used: Allowance!
}

enum TaxRegime {
  MEI
  SIMPLES
  PRESUMIDO
  REAL
}

enum SimplesAnnex {
  I
  II
  III
  IV
  V
}

enum CompanyActivity {
  COMMERCE
  INDUSTRY
  SERVICES
  COMMERCE_SERVICES
}

"Where a competência's revenue comes from."
enum RevenueOrigin {
  DECLARED
  INCOME_SOURCE
  NONE
}

"A Titular's company: its CNPJ, tax regime and what its taxes are worked out from."
type Company {
  id: ID!
  cnpj: String!
  name: String
  regime: TaxRegime!
  "Simples Nacional: the Anexo registered."
  annex: SimplesAnnex
  "Simples: Anexo III or V by payroll (28% of the RBT12)."
  fatorR: Boolean!
  activity: CompanyActivity!
  "Revenue from abroad: no PIS, Cofins, ISS, ICMS or IPI."
  exports: Boolean!
  "Lucro Presumido: the city's ISS rate, as a fraction."
  issRate: Float
  proLaboreCents: Cents!
  "What the monthly pró-labore keeps and pays."
  proLabore: ProLabore!
  "The Fonte de Renda the revenue arrives as, if any."
  revenueSourceId: ID
  startsOn: Date!
  "The last `last` competências (up to 24) through `upTo` (`YYYY-MM`), newest first."
  months(upTo: String!, last: Int!): [CompanyMonth!]!
}

type ProLabore {
  grossCents: Cents!
  "The partner's INSS, 11% up to the ceiling."
  inssCents: Cents!
  irrfCents: Cents!
  netCents: Cents!
  "The company's 20%, when its regime does not pay it inside the DAS."
  employerInssCents: Cents!
}

"One competência of a company: its revenue, RBT12, Simples bracket and the guides it owes."
type CompanyMonth {
  month: String!
  revenueCents: Cents!
  revenueOrigin: RevenueOrigin!
  rbt12Cents: Cents!
  "Whether the RBT12 was typed (as the PGDAS-D shows it) or worked out."
  rbt12Typed: Boolean!
  annex: SimplesAnnex
  bracket: Int
  nominalRate: Float
  "The rate on this month's revenue, after the parcela a deduzir and what exports leave out."
  effectiveRate: Float
  "The RBT12 is over the Simples limit (R$ 4,8 milhões)."
  overLimit: Boolean!
  guides: [TaxGuide!]!
}

"A guide to pay (DAS, DARF, ISS) for one competência, due the month after."
type TaxGuide {
  name: String!
  detail: String!
  amountCents: Cents!
  dueDate: Date!
  competence: String!
}

input CompanyInput {
  holderId: ID!
  cnpj: String!
  name: String
  regime: TaxRegime!
  annex: SimplesAnnex
  fatorR: Boolean
  activity: CompanyActivity
  exports: Boolean
  "Percent as typed, e.g. \"2\" for 2%."
  issRate: String
  proLaboreCents: Cents
  revenueSourceId: ID
  startsOn: Date!
}

input CompanyRevenueInput {
  companyId: ID!
  month: String!
  amountCents: Cents!
  rbt12Cents: Cents
}

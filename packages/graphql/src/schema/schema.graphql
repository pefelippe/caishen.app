"ISO calendar date, `YYYY-MM-DD`."
scalar Date
"ISO 8601 timestamp."
scalar DateTime
"Integer amount of cents (docs/adr/0004)."
scalar Cents

enum HolderKind {
  PF
  PJ
}

enum Modality {
  CARD_INSTALLMENT
  GOODS_FINANCING
  OTHER
  OVERDRAFT
  PAYROLL_LOAN_INSS
  PAYROLL_LOAN_PRIVATE
  PAYROLL_LOAN_PUBLIC
  PERSONAL_LOAN
  REAL_ESTATE_FINANCING
  VEHICLE_FINANCING
}

enum AmortizationSystem {
  PRICE
  SAC
}

enum RateSource {
  INFORMED
  IMPLIED
}

"Risk of default a Score indicates, with SPC cut-offs (docs/adr/0005)."
enum RiskBand {
  HIGH
  MEDIUM
  LOW
}

enum Bureau {
  SPC
  SERASA
  BOA_VISTA
  QUOD
}

enum InstallmentStatus {
  UPCOMING
  PAID
  PAID_LATE
  OPEN_LATE
}

enum DataSource {
  BACEN_REGISTRATO
  BUREAU
  OPEN_FINANCE
}

enum TaskStatus {
  TODO
  DOING
  DONE
}

"An Area, or `GENERAL` for the Buddy that sees all of them."
enum BuddyArea {
  GENERAL
  FINANCE
  NOTES
  WORK
  FITNESS
}

enum MessageRole {
  USER
  BUDDY
}

enum ConnectionKind {
  OPENROUTER
  GOOGLE_DRIVE
  SPOTIFY
}

"What a Connection is for; the Conexões page has one section per category."
enum ConnectionCategory {
  AI
  FILE_STORAGE
  MUSIC
}

type Query {
  viewer: Viewer
  "The Holder the signed-in User is (docs/adr/0007); created or adopted on first use."
  viewerHolder: Holder!
  projects: [Project!]!
  tasks: [Task!]!
  "Pomodoros finished today and in the current week (Monday to Sunday)."
  focus: Focus!
  "Newest first."
  workouts: [Workout!]!
  fitnessWeek: FitnessWeek!
  "The last `weeks` weeks, oldest first, ending with the current one."
  fitnessHistory(weeks: Int = 8): [FitnessWeek!]!
  buddies: [Buddy!]!
  buddy(area: BuddyArea!): Buddy!
  "Models available to Buddies; empty when the server has no OpenRouter key."
  models: [Model!]!
  aiStatus: AiStatus!
  conversations(buddyId: ID!): [Conversation!]!
  conversation(id: ID!): Conversation
  connections: [Connection!]!
  "Records of every Area whose title or text contains `term` (at least two characters)."
  search(term: String!): [SearchHit!]!
  holders: [Holder!]!
  holder(id: ID!): Holder
  creditOperation(id: ID!): CreditOperation
  notes: [Note!]!
  note(id: ID!): Note
  marketIndicators: MarketIndicators!
}

type Mutation {
  createProject(name: String!): Project!
  deleteProject(id: ID!): Boolean!
  createTask(input: CreateTaskInput!): Task!
  updateTask(id: ID!, input: UpdateTaskInput!): Task!
  deleteTask(id: ID!): Boolean!
  "Records a Pomodoro that just ended, of `minutes` of focus, on a Task or on none."
  logPomodoro(taskId: ID, minutes: Int!): Pomodoro!
  deletePomodoro(id: ID!): Boolean!
  logWorkout(input: LogWorkoutInput!): Workout!
  deleteWorkout(id: ID!): Boolean!
  setWeeklyGoal(workoutsPerWeek: Int!): FitnessWeek!
  updateBuddy(id: ID!, input: UpdateBuddyInput!): Buddy!
  startConversation(buddyId: ID!): Conversation!
  deleteConversation(id: ID!): Boolean!
  "Links a file picked from a Connection to a Note or a Task."
  addAttachment(input: AddAttachmentInput!): Attachment!
  removeAttachment(id: ID!): Boolean!
  createHolder(input: CreateHolderInput!): Holder!
  "A payment outside the schedule that reduces the Outstanding Balance from `date` on."
  addExtraAmortization(creditOperationId: ID!, date: Date!, amountCents: Cents!): CreditOperation!
  removeExtraAmortization(id: ID!): CreditOperation!
  addIncomeSource(input: AddIncomeSourceInput!): IncomeSource!
  createCreditOperation(input: CreateCreditOperationInput!): CreditOperation!
  deleteCreditOperation(id: ID!): Boolean!
  createCreditCard(input: CreateCreditCardInput!): CreditCard!
  upsertStatement(input: UpsertStatementInput!): Statement!
  createNote(input: CreateNoteInput!): Note!
  renameNote(id: ID!, title: String!): Note!
  deleteNote(id: ID!): Boolean!
  generateAssessment(holderId: ID!): Assessment!
  "Records that an installment was late; a null `paidOn` keeps it open."
  recordLatePayment(creditOperationId: ID!, installmentNumber: Int!, paidOn: Date): LatePayment!
  "Marks the installment as paid on time again."
  clearLatePayment(creditOperationId: ID!, installmentNumber: Int!): Boolean!
  addReportedScore(input: AddReportedScoreInput!): ReportedScore!
  "Stores an SCR Snapshot typed from a Registrato report. Needs an active Registrato Consent."
  createScrSnapshot(input: CreateScrSnapshotInput!): ScrSnapshot!
  deleteScrSnapshot(id: ID!): Boolean!
  grantConsent(holderId: ID!, source: DataSource!): Consent!
  revokeConsent(id: ID!): Consent!
}

"The signed-in User inside their active Organization."
type Viewer {
  userId: ID!
  organizationId: ID!
  role: String!
}

type Holder {
  id: ID!
  kind: HolderKind!
  name: String!
  document: String
  birthDate: Date
  "Sum of Income Sources in force today."
  monthlyIncomeCents: Cents!
  incomeSources: [IncomeSource!]!
  creditOperations: [CreditOperation!]!
  creditCards: [CreditCard!]!
  assessments: [Assessment!]!
  reportedScores: [ReportedScore!]!
  "Newest reference month first."
  scrSnapshots: [ScrSnapshot!]!
  "Outstanding Balance of Credit Operations plus open Statements, to reconcile with the SCR."
  registeredDebtCents: Cents!
  consents: [Consent!]!
  "Installments and Statements due in the next 30 days, soonest first."
  upcomingDues: [UpcomingDue!]!
}

type UpcomingDue {
  label: String!
  dueDate: Date!
  amountCents: Cents!
}

type Project {
  id: ID!
  name: String!
}

type Task {
  id: ID!
  title: String!
  status: TaskStatus!
  dueOn: Date
  project: Project
  attachments: [Attachment!]!
  "How many Pomodoros were finished on this Task."
  pomodoros: Int!
  createdAt: DateTime!
}

type Pomodoro {
  id: ID!
  minutes: Int!
  endedAt: DateTime!
  task: Task
}

type Focus {
  "Today's Pomodoros, oldest first."
  today: [Pomodoro!]!
  todayMinutes: Int!
  weekCount: Int!
  weekMinutes: Int!
}

type Workout {
  id: ID!
  date: Date!
  kind: String!
  durationMinutes: Int!
  notes: String
}

"Progress of the Weekly Goal in the current week (Monday to Sunday)."
type FitnessWeek {
  weekStart: Date!
  weekEnd: Date!
  "Null until a Weekly Goal is set."
  goal: Int
  done: Int!
  minutes: Int!
}

type Buddy {
  id: ID!
  area: BuddyArea!
  name: String!
  personality: String!
  "OpenRouter model id in use (own choice or the server default)."
  model: String!
  "False when the model cannot call tools, so the Buddy only reads and talks."
  canAct: Boolean!
}

type Model {
  id: ID!
  name: String!
  free: Boolean!
  supportsTools: Boolean!
}

type AiStatus {
  "False when OPENROUTER_API_KEY is missing."
  configured: Boolean!
  defaultModel: String!
}

type Conversation {
  id: ID!
  title: String!
  buddy: Buddy!
  messages: [Message!]!
  updatedAt: DateTime!
}

type Message {
  id: ID!
  role: MessageRole!
  content: String!
  actions: [BuddyAction!]!
  createdAt: DateTime!
}

"Something the Buddy did to the data while answering."
type BuddyAction {
  "`TASK`, `WORKOUT` or `NOTE`."
  kind: String!
  label: String!
  targetId: ID
}

enum SearchKind {
  TASK
  NOTE
  WORKOUT
  CREDIT_OPERATION
  CREDIT_CARD
}

type SearchHit {
  kind: SearchKind!
  "Id of the record, to link to it."
  id: ID!
  area: BuddyArea!
  title: String!
  detail: String
}

type Connection {
  kind: ConnectionKind!
  category: ConnectionCategory!
  "What the Connection is doing right now, in pt-BR (e.g. the default Model)."
  detail: String
  "False for Connections that are not built yet."
  available: Boolean!
  connected: Boolean!
  "Why it cannot be connected right now, in pt-BR."
  unavailableReason: String
}

type Attachment {
  id: ID!
  fileId: String!
  name: String!
  mimeType: String!
  url: String!
}

type IncomeSource {
  id: ID!
  description: String!
  monthlyNetCents: Cents!
  startsOn: Date!
  endsOn: Date
}

type CreditOperation {
  id: ID!
  holder: Holder!
  name: String!
  lender: String
  modality: Modality!
  modalityLabel: String!
  system: AmortizationSystem!
  principalCents: Cents!
  "Monthly effective rate as a fraction (0.0189 = 1,89% a.m.)."
  monthlyRate: Float!
  annualRate: Float!
  rateSource: RateSource!
  termMonths: Int!
  firstDueDate: Date!
  "First installment (constant in Price)."
  installmentCents: Cents!
  outstandingBalanceCents: Cents!
  paidInstallments: Int!
  "Resolução CMN 4.966 stage: 1, 2 or 3 by days of the oldest open Late Payment."
  stage: Int!
  overdueCents: Cents!
  latePayments: [LatePayment!]!
  "Oldest first."
  extraAmortizations: [ExtraAmortization!]!
  collateralDescription: String
  collateralValueCents: Cents
  schedule: [Installment!]!
  marketRate: MarketRate
}

type ExtraAmortization {
  id: ID!
  date: Date!
  amountCents: Cents!
}

type Installment {
  number: Int!
  dueDate: Date!
  installmentCents: Cents!
  interestCents: Cents!
  amortizationCents: Cents!
  extraAmortizationCents: Cents!
  balanceCents: Cents!
  status: InstallmentStatus!
  paidOn: Date
  daysLate: Int!
}

"Median rate across institutions published by Bacen for a Modality."
type MarketRate {
  monthlyRate: Float!
  period: String!
  institutions: Int!
}

type CreditCard {
  id: ID!
  name: String!
  issuer: String
  limitCents: Cents!
  closingDay: Int!
  dueDay: Int!
  statements: [Statement!]!
}

type Statement {
  id: ID!
  referenceMonth: String!
  amountCents: Cents!
  dueDate: Date!
}

type Note {
  id: ID!
  title: String!
  task: Task
  attachments: [Attachment!]!
  holder: Holder
  creditOperation: CreditOperation
  creditCard: CreditCard
  updatedAt: DateTime!
}

type Assessment {
  id: ID!
  "0 to 1000, same scale as the bureaus."
  score: Int!
  band: RiskBand!
  breakdown: ScoreBreakdown!
  modelVersion: String!
  indicators: AssessmentIndicators!
  createdAt: DateTime!
}

type ScoreBreakdown {
  "Up to 500."
  punctuality: Int!
  "Up to 300."
  capacity: Int!
  "Up to 200."
  utilization: Int!
}

type LatePayment {
  id: ID!
  installmentNumber: Int!
  dueDate: Date!
  paidOn: Date
  daysLate: Int!
}

type ReportedScore {
  id: ID!
  bureau: Bureau!
  score: Int!
  band: RiskBand!
  consultedOn: Date!
}

type AssessmentIndicators {
  incomeCommitment: Float!
  debtToIncome: Float!
  creditUtilization: Float
  monthlyIncomeCents: Cents!
  dueNext30DaysCents: Cents!
  outstandingDebtCents: Cents!
  paymentCapacityCents: Cents!
  suggestedLimitCents: Cents!
  overdueCents: Cents!
  worstStage: Int!
  lateLast12Months: Int!
  scrDebtCents: Cents
  scrReferenceMonth: String
}

"A Holder's debts in the Bacen SCR for one reference month, from a Registrato report."
type ScrSnapshot {
  id: ID!
  "`YYYY-MM` data-base."
  referenceMonth: String!
  "True when extracted from a file, false when typed in."
  imported: Boolean!
  createdAt: DateTime!
  entries: [ScrEntry!]!
  totals: ScrTotals!
}

type ScrEntry {
  id: ID!
  institution: String!
  modality: String!
  dueCents: Cents!
  overdueCents: Cents!
  overdueMaxDays: Int
  lossCents: Cents!
  limitCents: Cents!
}

type ScrTotals {
  dueCents: Cents!
  overdueCents: Cents!
  lossCents: Cents!
  limitCents: Cents!
  "due + overdue + loss"
  debtCents: Cents!
  stage: Int!
}

type Consent {
  id: ID!
  source: DataSource!
  grantedAt: DateTime!
  revokedAt: DateTime
}

type MarketIndicators {
  "Selic target, % a.a."
  selic: Float
  "CDI, % a.a."
  cdi: Float
  "IPCA of the last published month, %."
  ipca: Float
}

input CreateTaskInput {
  title: String!
  dueOn: Date
  projectId: ID
}

"Omitted fields stay as they are; `dueOn` and `projectId` accept null to clear."
input UpdateTaskInput {
  title: String
  status: TaskStatus
  dueOn: Date
  projectId: ID
}

input LogWorkoutInput {
  date: Date!
  kind: String!
  durationMinutes: Int!
  notes: String
}

"A null `model` goes back to the server default."
input UpdateBuddyInput {
  name: String
  personality: String
  model: String
}

"Exactly one of `noteId` and `taskId`."
input AddAttachmentInput {
  noteId: ID
  taskId: ID
  fileId: String!
  name: String!
  mimeType: String!
  url: String!
}

input CreateHolderInput {
  name: String!
  document: String
  birthDate: Date
}

input AddIncomeSourceInput {
  holderId: ID!
  description: String!
  monthlyNetCents: Cents!
  startsOn: Date!
  endsOn: Date
}

"Provide `monthlyRate` or `installmentCents`; the other is derived."
input CreateCreditOperationInput {
  holderId: ID!
  name: String!
  lender: String
  modality: Modality!
  system: AmortizationSystem!
  principalCents: Cents!
  termMonths: Int!
  firstDueDate: Date!
  monthlyRate: Float
  installmentCents: Cents
  collateralDescription: String
  collateralValueCents: Cents
}

input CreateCreditCardInput {
  holderId: ID!
  name: String!
  issuer: String
  limitCents: Cents!
  closingDay: Int!
  dueDay: Int!
}

input UpsertStatementInput {
  creditCardId: ID!
  "`YYYY-MM` of the month the Statement is due."
  referenceMonth: String!
  amountCents: Cents!
}

input CreateNoteInput {
  title: String
  taskId: ID
  holderId: ID
  creditOperationId: ID
  creditCardId: ID
}

input AddReportedScoreInput {
  holderId: ID!
  bureau: Bureau!
  score: Int!
  consultedOn: Date!
}

input ScrEntryInput {
  institution: String!
  modality: String!
  dueCents: Cents!
  overdueCents: Cents!
  overdueMaxDays: Int
  lossCents: Cents!
  limitCents: Cents!
}

input CreateScrSnapshotInput {
  holderId: ID!
  referenceMonth: String!
  entries: [ScrEntryInput!]!
}

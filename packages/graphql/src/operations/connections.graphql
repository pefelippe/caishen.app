query Connections {
  connections {
    kind
    category
    detail
    available
    connected
    unavailableReason
  }
}

mutation AddAttachment($input: AddAttachmentInput!) {
  addAttachment(input: $input) {
    ...AttachmentFields
  }
}

mutation RemoveAttachment($id: ID!) {
  removeAttachment(id: $id)
}

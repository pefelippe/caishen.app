query Connections {
  connections {
    kind
    category
    detail
    available
    connected
    unavailableReason
  }
}

query WhatsappLink {
  whatsappLink {
    phone
    linkedAt
  }
}

mutation StartWhatsappLink {
  startWhatsappLink {
    code
    url
    expiresAt
  }
}

mutation UnlinkWhatsapp {
  unlinkWhatsapp
}

fragment BankLinkFields on BankLink {
  id
  institution
  status
  error
  consentExpiresAt
  lastSyncedAt
  accounts {
    id
    kind
    name
    number
    balanceCents
  }
}

query BankLinks {
  bankLinks {
    ...BankLinkFields
  }
}

mutation LinkBank($itemId: String!) {
  linkBank(itemId: $itemId) {
    added
    link {
      ...BankLinkFields
    }
  }
}

mutation SyncBankLink($id: ID!) {
  syncBankLink(id: $id) {
    added
    link {
      ...BankLinkFields
    }
  }
}

mutation UnlinkBank($id: ID!) {
  unlinkBank(id: $id)
}

fragment AiKeyFields on AiKey {
  provider
  label
  last4
  updatedAt
}

query AiKeys {
  aiKeys {
    ...AiKeyFields
  }
}

mutation SetAiKey($provider: AiProvider!, $key: String!) {
  setAiKey(provider: $provider, key: $key) {
    ...AiKeyFields
  }
}

mutation RemoveAiKey($provider: AiProvider!) {
  removeAiKey(provider: $provider)
}

query CalendarFeed {
  calendarFeed {
    path
    createdAt
  }
}

mutation SetCalendarFeed($on: Boolean!) {
  setCalendarFeed(on: $on) {
    path
    createdAt
  }
}

fragment ExternalCalendarFields on ExternalCalendar {
  id
  name
  source
  host
  lastReadAt
  error
}

query ExternalCalendars {
  externalCalendars {
    ...ExternalCalendarFields
  }
}

mutation AddExternalCalendar($name: String!, $url: String!) {
  addExternalCalendar(name: $name, url: $url) {
    ...ExternalCalendarFields
  }
}

mutation RefreshExternalCalendar($id: ID!) {
  refreshExternalCalendar(id: $id) {
    ...ExternalCalendarFields
  }
}

mutation RemoveExternalCalendar($id: ID!) {
  removeExternalCalendar(id: $id)
}

fragment HealthInboxFields on HealthInbox {
  path
  createdAt
  lastReceivedAt
  lastCounts {
    steps
    weights
    bodyFat
    sleeps
    workouts
  }
}

query HealthInbox {
  healthInbox {
    ...HealthInboxFields
  }
}

mutation SetHealthInbox($on: Boolean!) {
  setHealthInbox(on: $on) {
    ...HealthInboxFields
  }
}

query GoogleTasksSync {
  googleTasksSync {
    lastSyncedAt
    error
  }
}

mutation SyncGoogleTasks {
  syncGoogleTasks {
    added
    done
    removed
    lastSyncedAt
  }
}

mutation StartTelegramLink {
  startTelegramLink {
    url
    expiresAt
  }
}

mutation UnlinkTelegram {
  unlinkTelegram
}

query Connections {
  connections {
    kind
    category
    detail
    available
    connected
    unavailableReason
  }
}

query WhatsappLink {
  whatsappLink {
    phone
    linkedAt
  }
}

mutation StartWhatsappLink {
  startWhatsappLink {
    code
    url
    expiresAt
  }
}

mutation UnlinkWhatsapp {
  unlinkWhatsapp
}

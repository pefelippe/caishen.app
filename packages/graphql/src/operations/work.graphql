fragment TaskFields on Task {
  id
  title
  status
  dueOn
  pomodoros
  project {
    id
    name
  }
  attachments {
    ...AttachmentFields
  }
}

query Work {
  projects {
    id
    name
  }
  tasks {
    ...TaskFields
  }
}

mutation CreateProject($name: String!) {
  createProject(name: $name) {
    id
  }
}

mutation DeleteProject($id: ID!) {
  deleteProject(id: $id)
}

mutation CreateTask($input: CreateTaskInput!) {
  createTask(input: $input) {
    id
  }
}

mutation UpdateTask($id: ID!, $input: UpdateTaskInput!) {
  updateTask(id: $id, input: $input) {
    ...TaskFields
  }
}

mutation DeleteTask($id: ID!) {
  deleteTask(id: $id)
}

fragment FocusFields on Focus {
  todayMinutes
  weekCount
  weekMinutes
  today {
    id
    minutes
    endedAt
    task {
      id
      title
    }
  }
}

query Focus {
  focus {
    ...FocusFields
  }
}

mutation LogPomodoro($taskId: ID, $minutes: Int!) {
  logPomodoro(taskId: $taskId, minutes: $minutes) {
    id
  }
}

mutation DeletePomodoro($id: ID!) {
  deletePomodoro(id: $id)
}

fragment AttachmentFields on Attachment {
  id
  fileId
  name
  mimeType
  url
}

fragment JobFields on Job {
  id
  instructions
  status
  createdAt
  finishedAt
}

query Jobs($botId: ID!) {
  jobs(botId: $botId) {
    ...JobFields
  }
}

fragment RoutineFields on Routine {
  id
  instructions
  cadence
  nextRunAt
  paused
}

query Routines($botId: ID!) {
  routines(botId: $botId) {
    ...RoutineFields
  }
}

mutation CreateRoutine($input: CreateRoutineInput!) {
  createRoutine(input: $input) {
    ...RoutineFields
  }
}

mutation SetRoutinePaused($id: ID!, $paused: Boolean!) {
  setRoutinePaused(id: $id, paused: $paused) {
    ...RoutineFields
  }
}

mutation DeleteRoutine($id: ID!) {
  deleteRoutine(id: $id)
}

query Job($id: ID!) {
  job(id: $id) {
    ...JobFields
    deliverable
    error
    model
    startedAt
    attachments {
      ...AttachmentFields
    }
    routine {
      ...RoutineFields
    }
    bot {
      ...BotFields
    }
  }
}

mutation CreateJob($input: CreateJobInput!) {
  createJob(input: $input) {
    ...JobFields
  }
}

mutation RetryJob($id: ID!) {
  retryJob(id: $id) {
    ...JobFields
  }
}

mutation CancelJob($id: ID!) {
  cancelJob(id: $id) {
    id
    status
    error
    deliverable
  }
}

mutation DeleteJob($id: ID!) {
  deleteJob(id: $id)
}

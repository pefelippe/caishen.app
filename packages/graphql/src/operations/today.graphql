query Today {
  viewerHolder {
    id
    upcomingDues {
      label
      dueDate
      amountCents
    }
  }
  tasks {
    id
    title
    status
    dueOn
    project {
      id
      name
    }
  }
  focus {
    todayMinutes
    weekMinutes
    today {
      id
    }
  }
  fitnessWeek {
    ...FitnessWeekFields
  }
  notes {
    id
    title
    updatedAt
  }
}

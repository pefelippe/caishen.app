fragment AttachmentFields on Attachment {
  id
  fileId
  name
  mimeType
  url
}

query Notes {
  notes {
    id
    title
    updatedAt
    task {
      id
      title
    }
    creditOperation {
      id
      name
    }
    creditCard {
      id
      name
    }
  }
}

query Note($id: ID!) {
  note(id: $id) {
    id
    title
    updatedAt
    attachments {
      ...AttachmentFields
    }
  }
}

mutation CreateNote($input: CreateNoteInput!) {
  createNote(input: $input) {
    id
  }
}

mutation RenameNote($id: ID!, $title: String!) {
  renameNote(id: $id, title: $title) {
    id
    title
  }
}

mutation DeleteNote($id: ID!) {
  deleteNote(id: $id)
}

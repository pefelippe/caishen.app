query Viewer {
  viewer {
    userId
    organizationId
    role
  }
}

query ViewerHolder {
  viewerHolder {
    id
  }
}

fragment AssessmentFields on Assessment {
  id
  score
  band
  modelVersion
  breakdown {
    punctuality
    capacity
    utilization
  }
  createdAt
  indicators {
    incomeCommitment
    debtToIncome
    creditUtilization
    monthlyIncomeCents
    dueNext30DaysCents
    outstandingDebtCents
    paymentCapacityCents
    suggestedLimitCents
    overdueCents
    worstStage
    lateLast12Months
    scrDebtCents
    scrReferenceMonth
  }
}

query Holder($id: ID!) {
  holder(id: $id) {
    id
    name
    document
    birthDate
    monthlyIncomeCents
    incomeSources {
      id
      description
      currency
      monthlyNetCents
      monthlyNetBrlCents
      iofRate
      spreadRate
      paydays
      startsOn
      endsOn
    }
    taxes {
      id
      name
      amountCents
      frequency
      installments
      dueDay
      dueMonth
    }
    recurringExpenses {
      id
      description
      amountCents
      cycle
      dueDay
      dueMonth
      paymentMethod
      creditCard {
        id
        name
      }
      category
      startsOn
      endsOn
    }
    creditOperations {
      id
      name
      lender
      modality
      modalityLabel
      principalCents
      monthlyRate
      termMonths
      installmentCents
      outstandingBalanceCents
      paidInstallments
      stage
      overdueCents
    }
    creditCards {
      id
      name
      issuer
      limitCents
      closingDay
      dueDay
      statements {
        id
        referenceMonth
        amountCents
        dueDate
      }
    }
    assessments {
      ...AssessmentFields
    }
    registeredDebtCents
    expenses {
      id
      date
      description
      category
      amountCents
      imported
    }
    upcomingDues {
      label
      dueDate
      amountCents
    }
    scrSnapshots {
      id
      referenceMonth
      imported
      createdAt
      totals {
        dueCents
        overdueCents
        lossCents
        limitCents
        debtCents
        stage
      }
      entries {
        id
        institution
        modality
        dueCents
        overdueCents
        overdueMaxDays
        lossCents
        limitCents
      }
    }
    reportedScores {
      id
      bureau
      score
      band
      consultedOn
    }
    consents {
      id
      source
      grantedAt
      revokedAt
    }
  }
}

mutation AddIncomeSource($input: AddIncomeSourceInput!) {
  addIncomeSource(input: $input) {
    id
  }
}

mutation AddTax($input: AddTaxInput!) {
  addTax(input: $input) {
    id
  }
}

mutation DeleteTax($id: ID!) {
  deleteTax(id: $id)
}

fragment StatementFields on MonthStatement {
  month
  incomeCents
  commitmentsCents
  expensesCents
  balanceCents
  incomes {
    id
    kind
    label
    date
    amountCents
    foreign {
      amountCents
      currency
      rate
      rateDate
      rateSource
    }
  }
  commitments {
    id
    kind
    label
    date
    amountCents
  }
  onCard {
    id
    kind
    label
    date
    amountCents
  }
  expenses {
    id
    date
    description
    category
    amountCents
    imported
  }
}

query Month($holderId: ID!, $month: String!) {
  holder(id: $holderId) {
    id
    month(month: $month) {
      ...StatementFields
    }
  }
}

query Period($holderId: ID!, $from: Date!, $to: Date!) {
  holder(id: $holderId) {
    id
    period(from: $from, to: $to) {
      ...StatementFields
    }
  }
}

query Report($holderId: ID!) {
  holder(id: $holderId) {
    id
    months(last: 6) {
      month
      incomeCents
      commitmentsCents
      expensesCents
      balanceCents
      expenses {
        id
        category
        amountCents
      }
    }
    creditOperations {
      id
      name
      outstandingBalanceCents
    }
  }
}

mutation AddOneOffIncome($input: OneOffIncomeInput!) {
  addOneOffIncome(input: $input)
}

mutation DeleteOneOffIncome($id: ID!) {
  deleteOneOffIncome(id: $id)
}

mutation AddExpense($input: ExpenseInput!) {
  addExpense(input: $input) {
    id
  }
}

mutation ImportExpenses($holderId: ID!, $rows: [ExpenseRowInput!]!) {
  importExpenses(holderId: $holderId, rows: $rows)
}

mutation DeleteExpense($id: ID!) {
  deleteExpense(id: $id)
}

mutation GenerateAssessment($holderId: ID!) {
  generateAssessment(holderId: $holderId) {
    ...AssessmentFields
  }
}

mutation GrantConsent($holderId: ID!, $source: DataSource!) {
  grantConsent(holderId: $holderId, source: $source) {
    id
  }
}

query MarketIndicators {
  marketIndicators {
    selic
    cdi
    ipca
  }
}

mutation AddReportedScore($input: AddReportedScoreInput!) {
  addReportedScore(input: $input) {
    id
  }
}

mutation CreateScrSnapshot($input: CreateScrSnapshotInput!) {
  createScrSnapshot(input: $input) {
    id
  }
}

mutation DeleteScrSnapshot($id: ID!) {
  deleteScrSnapshot(id: $id)
}

query RecordFields($kind: RecordKind!, $id: ID!) {
  recordFields(kind: $kind, id: $id) {
    key
    kind
    label
    value
    options {
      value
      label
    }
  }
}

mutation UpdateRecord($kind: RecordKind!, $id: ID!, $values: [RecordValueInput!]!) {
  updateRecord(kind: $kind, id: $id, values: $values)
}

mutation DeleteRecord($kind: RecordKind!, $id: ID!) {
  deleteRecord(kind: $kind, id: $id)
}

mutation AddRecurringExpense($input: RecurringExpenseInput!) {
  addRecurringExpense(input: $input) {
    id
  }
}

mutation SetIncomeRate($incomeSourceId: ID!, $date: Date!, $rate: Float) {
  setIncomeRate(incomeSourceId: $incomeSourceId, date: $date, rate: $rate)
}

fragment CompanyFields on Company {
  id
  cnpj
  name
  regime
  annex
  fatorR
  activity
  exports
  issRate
  proLaboreCents
  revenueSourceId
  startsOn
  proLabore {
    grossCents
    inssCents
    irrfCents
    netCents
    employerInssCents
  }
}

query Company($holderId: ID!, $upTo: String!) {
  holder(id: $holderId) {
    id
    incomeSources {
      id
      description
      currency
    }
    company {
      ...CompanyFields
      months(upTo: $upTo, last: 12) {
        month
        revenueCents
        revenueOrigin
        rbt12Cents
        rbt12Typed
        annex
        bracket
        nominalRate
        effectiveRate
        overLimit
        guides {
          name
          detail
          amountCents
          dueDate
          competence
        }
      }
    }
  }
}

mutation SaveCompany($input: CompanyInput!) {
  saveCompany(input: $input) {
    ...CompanyFields
  }
}

mutation DeleteCompany($id: ID!) {
  deleteCompany(id: $id)
}

mutation SetCompanyRevenue($input: CompanyRevenueInput!) {
  setCompanyRevenue(input: $input) {
    month
  }
}

mutation ClearCompanyRevenue($companyId: ID!, $month: String!) {
  clearCompanyRevenue(companyId: $companyId, month: $month)
}

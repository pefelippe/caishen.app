# Day to day: `pnpm infra:up` (Postgres only) + `pnpm dev` on the host.
# Whole stack in containers: `docker compose up --build`.
name: zapbots

x-app: &app
  build: .
  image: zapbots-app:dev
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgres://zapbots:zapbots@postgres:5432/zapbots
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-please}
    CLIENT_ORIGIN: http://localhost:5173
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_DB: zapbots
      POSTGRES_PASSWORD: zapbots
      POSTGRES_USER: zapbots
    ports:
      - '5433:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zapbots -d zapbots']
      interval: 2s
      timeout: 3s
      retries: 20

  server:
    <<: *app
    command: sh -c "pnpm db:migrate && pnpm --filter @zapbots/server start"
    ports:
      - '4000:4000'

  client:
    <<: *app
    command: sh -c "pnpm --filter @zapbots/client build && pnpm --filter @zapbots/client preview"
    environment:
      SERVER_URL: http://server:4000
    depends_on:
      - server
    ports:
      - '5173:5173'

volumes:
  postgres:
